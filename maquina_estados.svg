<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="100%" height="100%">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
    <style>
      .state-rect { stroke: #2c3e50; stroke-width: 2; rx: 10; ry: 10; }
      .state-title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #2c3e50; text-anchor: middle; }
      .state-line { stroke: #2c3e50; stroke-width: 1; }
      .state-out { font-family: monospace; font-size: 11px; fill: #34495e; text-anchor: start; }
      .trans-label { font-family: Arial, sans-serif; font-size: 11px; fill: #c0392b; text-anchor: middle; }
      .trans-bg { fill: #ffffff; opacity: 0.85; }
      .note { font-family: Arial, sans-serif; font-size: 12px; fill: #7f8c8d; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="800" fill="#f8f9fa"/>

  <!-- State: NORMAL -->
  <rect x="590" y="80" width="220" height="140" class="state-rect" fill="#e8f5e9"/>
  <text x="700" y="105" class="state-title">NORMAL</text>
  <line x1="590" y1="115" x2="810" y2="115" class="state-line"/>
  <text x="600" y="132" class="state-out">VALVE_IN = 1</text>
  <text x="600" y="147" class="state-out">VALVE_OUT = 0</text>
  <text x="600" y="162" class="state-out">COMPRESSOR = 0</text>
  <text x="600" y="177" class="state-out">OXYGEN_MASKS = 0</text>
  <text x="600" y="192" class="state-out">ALARM = 0</text>
  <text x="600" y="207" class="state-out">t_alt = 0, t_bleed = 0</text>

  <!-- State: LOW_PRESSURE -->
  <rect x="100" y="300" width="240" height="150" class="state-rect" fill="#e3f2fd"/>
  <text x="220" y="325" class="state-title">LOW_PRESSURE</text>
  <line x1="100" y1="335" x2="340" y2="335" class="state-line"/>
  <text x="110" y="352" class="state-out">VALVE_IN = 1</text>
  <text x="110" y="367" class="state-out">VALVE_OUT = 0</text>
  <text x="110" y="382" class="state-out">COMPRESSOR = 1</text>
  <text x="110" y="397" class="state-out">OXYGEN_MASKS = 0</text>
  <text x="110" y="412" class="state-out">ALARM = 0</text>
  <text x="110" y="427" class="state-out">t_alt++, t_bleed++</text>

  <!-- State: HIGH_PRESSURE -->
  <rect x="580" y="300" width="240" height="150" class="state-rect" fill="#fff3e0"/>
  <text x="700" y="325" class="state-title">HIGH_PRESSURE</text>
  <line x1="580" y1="335" x2="820" y2="335" class="state-line"/>
  <text x="590" y="352" class="state-out">VALVE_IN = 0</text>
  <text x="590" y="367" class="state-out">VALVE_OUT = 1</text>
  <text x="590" y="382" class="state-out">COMPRESSOR = 0</text>
  <text x="590" y="397" class="state-out">OXYGEN_MASKS = 0</text>
  <text x="590" y="412" class="state-out">ALARM = 0</text>
  <text x="590" y="427" class="state-out">t_alt++, t_bleed++</text>

  <!-- State: MANUAL_DUMP -->
  <rect x="1060" y="300" width="240" height="150" class="state-rect" fill="#fce4ec"/>
  <text x="1180" y="325" class="state-title">MANUAL_DUMP</text>
  <line x1="1060" y1="335" x2="1300" y2="335" class="state-line"/>
  <text x="1070" y="352" class="state-out">VALVE_IN = 0</text>
  <text x="1070" y="367" class="state-out">VALVE_OUT = 1</text>
  <text x="1070" y="382" class="state-out">COMPRESSOR = 0</text>
  <text x="1070" y="397" class="state-out">OXYGEN_MASKS = 0</text>
  <text x="1070" y="412" class="state-out">ALARM = 0</text>
  <text x="1070" y="427" class="state-out">t_alt++, t_bleed++</text>

  <!-- State: EMERGENCY_DESCENT -->
  <rect x="100" y="550" width="240" height="150" class="state-rect" fill="#ffebee"/>
  <text x="220" y="575" class="state-title">EMERGENCY_DESCENT</text>
  <line x1="100" y1="585" x2="340" y2="585" class="state-line"/>
  <text x="110" y="602" class="state-out">VALVE_IN = 0</text>
  <text x="110" y="617" class="state-out">VALVE_OUT = 0</text>
  <text x="110" y="632" class="state-out">COMPRESSOR = 0</text>
  <text x="110" y="647" class="state-out">OXYGEN_MASKS = 1</text>
  <text x="110" y="662" class="state-out">ALARM = 1</text>
  <text x="110" y="677" class="state-out">t_alt = 0, t_bleed++</text>

  <!-- State: CABIN_ALT_HIGH -->
  <rect x="580" y="550" width="240" height="150" class="state-rect" fill="#fff9c4"/>
  <text x="700" y="575" class="state-title">CABIN_ALT_HIGH</text>
  <line x1="580" y1="585" x2="820" y2="585" class="state-line"/>
  <text x="590" y="602" class="state-out">VALVE_IN = 0</text>
  <text x="590" y="617" class="state-out">VALVE_OUT = 0</text>
  <text x="590" y="632" class="state-out">COMPRESSOR = 0</text>
  <text x="590" y="647" class="state-out">OXYGEN_MASKS = 1</text>
  <text x="590" y="662" class="state-out">ALARM = 1</text>
  <text x="590" y="677" class="state-out">t_alt = 0, t_bleed++</text>

  <!-- State: FAULT -->
  <rect x="1060" y="550" width="240" height="150" class="state-rect" fill="#f5f5f5"/>
  <text x="1180" y="575" class="state-title">FAULT</text>
  <line x1="1060" y1="585" x2="1300" y2="585" class="state-line"/>
  <text x="1070" y="602" class="state-out">VALVE_IN = 0</text>
  <text x="1070" y="617" class="state-out">VALVE_OUT = 0</text>
  <text x="1070" y="632" class="state-out">COMPRESSOR = 0</text>
  <text x="1070" y="647" class="state-out">OXYGEN_MASKS = 0</text>
  <text x="1070" y="662" class="state-out">ALARM = 1</text>
  <text x="1070" y="677" class="state-out">(safe state)</text>

  <!-- Initial state circle -->
  <circle cx="700" cy="40" r="8" fill="#2c3e50"/>
  <line x1="700" y1="48" x2="700" y2="80" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- TRANSITIONS -->

  <!-- NORMAL -> LOW_PRESSURE -->
  <path d="M 590 180 Q 450 180 340 335" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="360" y="210" width="160" height="16" class="trans-bg" rx="3"/>
  <text x="440" y="222" class="trans-label">PRESSURE_LOW &amp;&amp; BLEED_OK</text>

  <!-- NORMAL -> HIGH_PRESSURE -->
  <path d="M 700 220 L 700 300" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="705" y="245" width="120" height="16" class="trans-bg" rx="3"/>
  <text x="765" y="257" class="trans-label">PRESSURE_HIGH</text>

  <!-- NORMAL -> MANUAL_DUMP -->
  <path d="M 810 180 Q 950 180 1060 335" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="880" y="210" width="130" height="16" class="trans-bg" rx="3"/>
  <text x="945" y="222" class="trans-label">MANUAL_DUMP</text>

  <!-- NORMAL -> EMERGENCY_DESCENT -->
  <path d="M 590 130 Q 300 130 220 550" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="320" y="140" width="160" height="16" class="trans-bg" rx="3"/>
  <text x="400" y="152" class="trans-label">EMERGENCY_DESCENT</text>

  <!-- NORMAL -> CABIN_ALT_HIGH -->
  <path d="M 700 220 Q 480 350 580 550" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="520" y="350" width="140" height="16" class="trans-bg" rx="3"/>
  <text x="590" y="362" class="trans-label">CABIN_ALT_HIGH [t_alt≥5]</text>

  <!-- NORMAL -> FAULT -->
  <path d="M 810 150 Q 1000 150 1060 550" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="900" y="180" width="130" height="16" class="trans-bg" rx="3"/>
  <text x="965" y="192" class="trans-label">!BLEED_OK [t_bleed≥10]</text>

  <!-- LOW_PRESSURE -> NORMAL -->
  <path d="M 340 400 Q 480 400 590 180" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="420" y="300" width="100" height="16" class="trans-bg" rx="3"/>
  <text x="470" y="312" class="trans-label">!PRESSURE_LOW</text>

  <!-- LOW_PRESSURE -> HIGH_PRESSURE -->
  <path d="M 340 340 Q 450 340 580 360" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="420" y="320" width="100" height="16" class="trans-bg" rx="3"/>
  <text x="470" y="332" class="trans-label">PRESSURE_HIGH</text>

  <!-- LOW_PRESSURE -> MANUAL_DUMP -->
  <path d="M 340 375 Q 700 250 1060 375" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="660" y="290" width="120" height="16" class="trans-bg" rx="3"/>
  <text x="720" y="302" class="trans-label">MANUAL_DUMP</text>

  <!-- LOW_PRESSURE -> EMERGENCY_DESCENT -->
  <path d="M 220 450 L 220 550" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="225" y="485" width="150" height="16" class="trans-bg" rx="3"/>
  <text x="300" y="497" class="trans-label">EMERGENCY_DESCENT</text>

  <!-- LOW_PRESSURE -> CABIN_ALT_HIGH -->
  <path d="M 340 450 Q 450 500 580 610" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="400" y="500" width="140" height="16" class="trans-bg" rx="3"/>
  <text x="470" y="512" class="trans-label">CABIN_ALT_HIGH [t_alt≥5]</text>

  <!-- LOW_PRESSURE -> FAULT -->
  <path d="M 340 450 Q 700 500 1060 600" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="650" y="480" width="140" height="16" class="trans-bg" rx="3"/>
  <text x="720" y="492" class="trans-label">!BLEED_OK [t_bleed≥10]</text>

  <!-- HIGH_PRESSURE -> NORMAL -->
  <path d="M 700 300 L 700 220" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="580" y="250" width="110" height="16" class="trans-bg" rx="3"/>
  <text x="635" y="262" class="trans-label">!PRESSURE_HIGH</text>

  <!-- HIGH_PRESSURE -> LOW_PRESSURE -->
  <path d="M 580 410 Q 450 410 340 400" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="420" y="390" width="130" height="16" class="trans-bg" rx="3"/>
  <text x="485" y="402" class="trans-label">PRESSURE_LOW&amp;&amp;BLEED_OK</text>

  <!-- HIGH_PRESSURE -> MANUAL_DUMP -->
  <path d="M 820 375 L 1060 375" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="870" y="355" width="120" height="16" class="trans-bg" rx="3"/>
  <text x="930" y="367" class="trans-label">MANUAL_DUMP</text>

  <!-- HIGH_PRESSURE -> EMERGENCY_DESCENT -->
  <path d="M 580 450 Q 400 500 340 550" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="400" y="460" width="150" height="16" class="trans-bg" rx="3"/>
  <text x="475" y="472" class="trans-label">EMERGENCY_DESCENT</text>

  <!-- HIGH_PRESSURE -> CABIN_ALT_HIGH -->
  <path d="M 700 450 L 700 550" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="705" y="485" width="140" height="16" class="trans-bg" rx="3"/>
  <text x="775" y="497" class="trans-label">CABIN_ALT_HIGH [t_alt≥5]</text>

  <!-- HIGH_PRESSURE -> FAULT -->
  <path d="M 820 450 Q 950 500 1060 600" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="900" y="470" width="140" height="16" class="trans-bg" rx="3"/>
  <text x="970" y="482" class="trans-label">!BLEED_OK [t_bleed≥10]</text>

  <!-- MANUAL_DUMP -> NORMAL -->
  <path d="M 1060 400 Q 950 400 810 180" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="880" y="300" width="110" height="16" class="trans-bg" rx="3"/>
  <text x="935" y="312" class="trans-label">!MANUAL_DUMP</text>

  <!-- MANUAL_DUMP -> HIGH_PRESSURE -->
  <path d="M 1060 410 L 820 410" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="870" y="415" width="120" height="16" class="trans-bg" rx="3"/>
  <text x="930" y="427" class="trans-label">PRESSURE_HIGH</text>

  <!-- MANUAL_DUMP -> LOW_PRESSURE -->
  <path d="M 1060 340 Q 700 220 340 340" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="650" y="260" width="140" height="16" class="trans-bg" rx="3"/>
  <text x="720" y="272" class="trans-label">PRESSURE_LOW&amp;&amp;BLEED_OK</text>

  <!-- MANUAL_DUMP -> EMERGENCY_DESCENT -->
  <path d="M 1060 450 Q 700 520 340 625" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="650" y="510" width="150" height="16" class="trans-bg" rx="3"/>
  <text x="725" y="522" class="trans-label">EMERGENCY_DESCENT</text>

  <!-- MANUAL_DUMP -> CABIN_ALT_HIGH -->
  <path d="M 1060 450 Q 950 500 820 600" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="900" y="500" width="140" height="16" class="trans-bg" rx="3"/>
  <text x="970" y="512" class="trans-label">CABIN_ALT_HIGH [t_alt≥5]</text>

  <!-- MANUAL_DUMP -> FAULT -->
  <path d="M 1180 450 L 1180 550" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1190" y="485" width="140" height="16" class="trans-bg" rx="3"/>
  <text x="1260" y="497" class="trans-label">!BLEED_OK [t_bleed≥10]</text>

  <!-- EMERGENCY_DESCENT -> NORMAL -->
  <path d="M 340 625 Q 480 450 590 180" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="420" y="400" width="180" height="16" class="trans-bg" rx="3"/>
  <text x="510" y="412" class="trans-label">!EMERGENCY_DESCENT &amp;&amp; !CABIN_ALT_HIGH</text>

  <!-- EMERGENCY_DESCENT -> CABIN_ALT_HIGH -->
  <path d="M 340 625 L 580 625" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="400" y="615" width="120" height="16" class="trans-bg" rx="3"/>
  <text x="460" y="627" class="trans-label">CABIN_ALT_HIGH</text>

  <!-- EMERGENCY_DESCENT -> FAULT -->
  <path d="M 340 650 Q 700 650 1060 625" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="660" y="645" width="140" height="16" class="trans-bg" rx="3"/>
  <text x="730" y="657" class="trans-label">!BLEED_OK [t_bleed≥10]</text>

  <!-- CABIN_ALT_HIGH -> NORMAL -->
  <path d="M 580 610 Q 480 450 590 180" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="480" y="380" width="120" height="16" class="trans-bg" rx="3"/>
  <text x="540" y="392" class="trans-label">!CABIN_ALT_HIGH</text>

  <!-- CABIN_ALT_HIGH -> EMERGENCY_DESCENT -->
  <path d="M 580 625 L 340 625" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="400" y="600" width="150" height="16" class="trans-bg" rx="3"/>
  <text x="475" y="612" class="trans-label">EMERGENCY_DESCENT</text>

  <!-- CABIN_ALT_HIGH -> FAULT -->
  <path d="M 820 625 L 1060 625" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="870" y="615" width="140" height="16" class="trans-bg" rx="3"/>
  <text x="940" y="627" class="trans-label">!BLEED_OK [t_bleed≥10]</text>

  <!-- FAULT -> NORMAL -->
  <path d="M 1060 600 Q 900 450 810 180" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="880" y="400" width="70" height="16" class="trans-bg" rx="3"/>
  <text x="915" y="412" class="trans-label">RESET</text>

  <!-- Notes -->
  <text x="20" y="740" class="note">Notas:</text>
  <text x="20" y="760" class="note">• Las guardas [t_alt≥5] y [t_bleed≥10] requieren variables extendidas (contadores de tiempo) que se incrementan con TICK_1S.</text>
  <text x="20" y="780" class="note">• Los timers se resetean al entrar en NORMAL. En EMERGENCY_DESCENT y CABIN_ALT_HIGH, t_alt se detiene/resetea (no se necesita).</text>
  <text x="20" y="20" class="note" style="font-weight:bold; fill:#2c3e50;">FSM - Sistema de Presurización de Cabina</text>
</svg>
